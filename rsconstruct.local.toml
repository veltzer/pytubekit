# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# Templates live in tera.templates/ and render to the repo root. Configs are
# Lua (config/*.lua), covered by the canonical dep_auto list.
[processor.tera]
src_dirs = ["tera.templates"]

# requirements.txt is not generated from import scanning; pyproject.toml
# declares the dependencies.
[processor.requirements]
enabled = false

# Runtime deps so CI (rsconstruct tools install-deps) can run pytest.
[dependencies]
pip = [
    "google-api-python-client",
    "pygooglehelper",
    "pytconf",
    "pylogconf",
    "yt-dlp",
    "browsercookie",
    # mkdocs-material is what .github/workflows/docs.yml deploys the mkdocs/
    # site with; declared here so install-deps installs it instead of the
    # workflow hand-running pip.
    "mkdocs-material",
]

name: docs
on:
  push:
    branches: [master]
    paths:
      - "mkdocs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: install rsconstruct
        run: |
          gh release download --repo veltzer/rsconstruct --pattern 'rsconstruct-linux-x86_64' --output /usr/local/bin/rsconstruct
          chmod +x /usr/local/bin/rsconstruct
          rsconstruct version
        env:
          GH_TOKEN: ${{ github.token }}
      # mkdocs-material comes from rsconstruct.local.toml [dependencies] pip;
      # nothing is pip-installed by hand.
      - name: install
        run: rsconstruct tools install-deps
      - name: deploy
        run: cd mkdocs && mkdocs gh-deploy --force

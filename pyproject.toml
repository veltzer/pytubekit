[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytubekit"
version = "0.0.40"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "Pytubekit will allow you to perform operations in your youtube account en masse"
readme = "README.md"
license = "MIT"
keywords=[
    "google",
    "youtube",
    "playlist",
    "videos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "google-api-python-client",
    "pygooglehelper",
    "pytconf",
    "pylogconf",
    "yt-dlp",
    "browsercookie",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pytubekit"
"Bug Tracker" = "https://github.com/veltzer/pytubekit/issues"
"Documentation" = "https://veltzer.github.io/pytubekit"
"Download" = "https://pypi.org/project/pytubekit/"
"Repository" = "https://github.com/veltzer/pytubekit"

[project.scripts]
pytubekit = "pytubekit.main:main"

[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
pythonpath = ["src"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytubekit"]
# client_secret.json is gitignored (GitHub push protection blocks OAuth
# secrets), but it must ship in the distribution so `pip install pytubekit`
# works with no setup. "artifacts" overrides the VCS-ignore exclusion.
artifacts = ["src/pytubekit/client_secret.json"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/pytubekit/client_secret.json"]
include = [
    "src/pytubekit/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
python-version = "3.14"
search-path = [
    "src",
    ".",
]

[tool.pyrefly.errors]
implicit-any-attribute = "error"
implicit-any-empty-container = "error"
instance-var-assign = "error"
method-assign = "error"
missing-override-decorator = "error"
no-any-return = "error"
possibly-uninitialized-attribute = "error"

[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"

[dependency-groups]
dev = [
    "hatchling",
    "pyrefly",
    "pytest",
    "ruff",
    "sphinx",
    "types-yt-dlp",
]
